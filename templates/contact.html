<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact Us - Mobile Accessories Shop</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #e3f2fd, #bbdefb);
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 1000px;
      margin: 50px auto;
      padding: 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #0d47a1;
      margin-bottom: 30px;
    }

    .contact-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
    }

    .form-section, .info-section {
      flex: 1 1 450px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 5px;
      font-size: 1rem;
    }

    button {
      margin-top: 20px;
      padding: 12px 30px;
      background: linear-gradient(to right, #1e88e5, #0d47a1);
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .info-section p {
      margin: 15px 0;
      color: #333;
      font-size: 1.1rem;
    }

    iframe {
      width: 100%;
      height: 250px;
      border-radius: 10px;
      margin-top: 20px;
      border: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Contact Us</h1>
    <div class="contact-grid">
      <div class="form-section">
        <form method="POST">
          <label>Name</label>
          <input type="text" name="name" required>

          <label>Email</label>
          <input type="email" name="email" required>

          <label>Message</label>
          <textarea name="message" rows="6" required></textarea>

          <button type="submit">Send Message</button>
        </form>
      </div>

      <div class="info-section">
        <p><strong>📞 Phone:</strong> +91 98765 43210</p>
        <p><strong>📧 Email:</strong> support@mobileaccessories.com</p>
        <p><strong>📍 Address:</strong> 123 Mobile Street, Trichy, Tamil Nadu, India</p>

        <!-- Google Map Embed -->
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3915.8662011033966!2d78.69542327485952!3d10.790483489359447!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3baaf539362d83e7%3A0x5c90f7e0e6e8794c!2sTrichy!5e0!3m2!1sen!2sin!4v1696515226801!5m2!1sen!2sin"
          allowfullscreen=""
          loading="lazy">
        </iframe>
      </div>
    </div>
  </div>

</body>
</html>
